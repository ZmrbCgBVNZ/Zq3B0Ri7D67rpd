<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岡山五天四夜</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Zen Maru Gothic',sans-serif;background:#F5F6FA;color:#2d3a4a;min-height:100vh;padding-bottom:80px;font-size:16px}
.header,.content,.tab-bar{max-width:480px;margin-left:auto;margin-right:auto}
:root{--fuji:#3B6FA0;--light-blue:#E8F0F8;--guide:#2D6A4F}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 20% 20%,rgba(59,111,160,.06) 0,transparent 50%),radial-gradient(circle at 80% 80%,rgba(176,160,168,.08) 0,transparent 50%);pointer-events:none;z-index:0}
body.guide-mode::before{background-image:radial-gradient(circle at 20% 20%,rgba(45,106,79,.08) 0,transparent 50%),radial-gradient(circle at 80% 80%,rgba(45,106,79,.06) 0,transparent 50%)}
body.guide-mode{background:#F0F5F2}
.header{background:linear-gradient(135deg,#3B6FA0,#5B8FC0);color:#fff;padding:20px 16px 16px;text-align:center;position:relative;z-index:1;border-radius:0 0 24px 24px;box-shadow:0 4px 20px rgba(59,111,160,.3);transition:.4s}
body.guide-mode .header{background:linear-gradient(135deg,#2D6A4F,#52B788);box-shadow:0 4px 20px rgba(45,106,79,.3)}
.header-icon{font-size:32px;margin-bottom:4px;cursor:pointer;display:inline-block;user-select:none}
.header h1{font-size:22px;font-weight:700}
.header .subtitle{font-size:14px;opacity:.85;margin-top:4px}
.header .dates{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 14px;font-size:14px;margin-top:8px}
.mode-badge{display:inline-flex;align-items:center;background:none;border:none;padding:3px 12px;font-size:12px;font-weight:700;height:28px;color:#fff;opacity:.9}
.font-size-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);border-radius:20px;padding:3px 12px;font-family:'Zen Maru Gothic',sans-serif;font-size:12px;font-weight:700;color:#fff;cursor:pointer;transition:.2s;height:28px}
.font-size-btn:hover{background:rgba(255,255,255,.35)}
.font-size-btn .fs-icon{font-size:13px}
#loading-overlay{position:fixed;inset:0;background:rgba(245,246,250,0.95);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity 0.3s ease}
.loader-spinner{width:48px;height:48px;border:5px solid #dce8f4;border-top-color:var(--fuji);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-card{background:#fff;border-radius:20px;padding:24px;max-width:400px;width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.1)}
.retry-btn{background:var(--fuji);color:#fff;border:none;border-radius:12px;padding:10px 20px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:16px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:24px;margin:20px;max-width:320px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-icon{font-size:40px;margin-bottom:12px}
.modal-title{font-size:18px;font-weight:700;color:#2d3a4a;margin-bottom:8px}
.modal-desc{font-size:14px;color:#777;line-height:1.6;margin-bottom:20px}
.modal-btns{display:flex;gap:10px}
.modal-btn{flex:1;padding:12px;border-radius:12px;border:none;font-family:'Zen Maru Gothic',sans-serif;font-size:15px;font-weight:700;cursor:pointer}
.modal-btn.confirm{background:#2D6A4F;color:#fff}
.modal-btn.confirm.to-family{background:var(--fuji)}
.modal-btn.cancel{background:#f0f2f4;color:#666}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8eaed;display:flex;z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.08);border-radius:20px 20px 0 0}
body.guide-mode .tab-bar{border-top:2px solid #52B788}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 12px;cursor:pointer;color:#999;font-size:13px;gap:3px}
.tab-item.active{color:var(--fuji)}
body.guide-mode .tab-item.active{color:var(--guide)}
.tab-item .tab-icon{font-size:24px}
.content{position:relative;z-index:1;padding:16px}
.tab-content{display:none}
.tab-content.active{display:block}
.day-selector{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.day-selector::-webkit-scrollbar{display:none}
.day-btn{flex-shrink:0;background:#fff;border:2px solid #e0e4ea;border-radius:20px;padding:8px 16px;font-family:'Zen Maru Gothic',sans-serif;font-size:14px;cursor:pointer;transition:.2s;color:#666;white-space:nowrap;line-height:1.4}
.day-btn.active{background:var(--fuji);border-color:var(--fuji);color:#fff;font-weight:700}
body.guide-mode .day-btn.active{background:var(--guide);border-color:var(--guide)}
.day-panel{display:none}
.day-panel.active{display:block}
.day-header{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1.5px solid var(--light-blue);display:flex;align-items:center;gap:12px}
.day-badge{background:var(--fuji);color:#fff;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;line-height:1.2;text-align:center;transition:.3s}
body.guide-mode .day-badge{background:var(--guide)}
.day-info h2{font-size:17px;color:var(--fuji);font-weight:700}
body.guide-mode .day-info h2{color:var(--guide)}
.day-info p{font-size:14px;color:#888;margin-top:2px}
.timeline-item{display:flex;gap:10px;margin-bottom:12px}
.time-col{flex-shrink:0;width:62px;display:flex;flex-direction:column;align-items:center;padding-top:14px}
.time-badge{background:var(--light-blue);color:var(--fuji);border-radius:8px;padding:4px 5px;font-size:14px;font-weight:700;text-align:center;line-height:1.4;white-space:nowrap}
body.guide-mode .time-badge{background:#E8F5EE;color:var(--guide)}
.time-line{flex:1;width:2px;background:#dce8f4;margin-top:6px;border-radius:2px}
.timeline-item:last-child .time-line{display:none}
.spot-card{background:#fff;border-radius:16px;padding:14px 14px 14px 18px;flex:1;border:1.5px solid #eef0f4;position:relative;overflow:hidden;min-width:0;display:flex;flex-direction:column;justify-content:center}
.spot-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.spot-card.type-food::before{background:#F4A261}
.spot-card.type-sight::before{background:#3B6FA0}
.spot-card.type-shop::before{background:#E07C8A}
.spot-card.type-activity::before{background:#5B8A5A}
.spot-card.type-hotel::before{background:#7B6CA8}
.spot-card.type-transport::before{background:#B8B0A8}
.card-img{width:100%;height:clamp(140px,30vw,200px);object-fit:cover;border-radius:10px;margin-bottom:10px;display:block}
.spot-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;flex-wrap:nowrap}
.spot-header-left{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.cat-badge{font-size:11px;font-weight:700;border-radius:10px;padding:4px 10px;align-self:flex-start}
.cat-food{background:#FFF0E6;color:#C06020}
.cat-sight{background:#E8F0F8;color:#1a5080}
.cat-shop{background:#FCEEF0;color:#B04060}
.cat-activity{background:#EAF3EA;color:#2A6030}
.cat-hotel{background:#F0EEF8;color:#5040A0}
.cat-transport{background:#F0EEF0;color:#606060}
.spot-name{font-size:16px;font-weight:700;color:#2d3a4a;line-height:1.3}
.spot-desc{font-size:16px;color:#666;margin-top:4px;line-height:1.8;white-space:pre-line}
.spot-desc:empty{display:none;margin:0;padding:0}
.spot-header-btns{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-top:2px}
.icon-btn{width:30px;height:30px;border-radius:8px;border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:.2s}
body.guide-mode .icon-btn.guide-only{display:flex;background:#E8F5EE}
.icon-btn.guide-only.active{background:#2D6A4F}
.more-panel{display:none;margin:10px 0 0 8px;border-radius:12px;overflow:hidden;border:1.5px solid #D0E4F8}
.more-panel.open{display:block}
.more-inner{background:#F5F9FF;padding:12px}
.more-text{font-size:14px;color:#2d3a4a;line-height:1.8;margin-bottom:10px;white-space:pre-line}
.guide-panel{display:none;margin:8px 0 0 8px;border-radius:12px;overflow:hidden;border:1.5px solid #B7E4C7}
.guide-panel.open{display:block}
.guide-inner{background:#F0FAF4;padding:12px}
.guide-note-text{font-size:13px;color:#2D6A4F;line-height:1.7;margin-bottom:10px;white-space:pre-line}
.album-label{font-size:12px;font-weight:700;color:#5580A0;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.album-label.green{color:#2D6A4F}
.album-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px;scroll-snap-type:x mandatory}
.album-scroll::-webkit-scrollbar{display:none}
.album-slide{flex-shrink:0;width:180px;height:120px;border-radius:10px;overflow:hidden;scroll-snap-align:start;background:#D0DCE8}
.album-slide img{width:100%;height:100%;object-fit:cover}
.album-dots{display:flex;gap:4px;justify-content:center;margin-top:4px}
.album-dot{width:5px;height:5px;border-radius:50%;background:#C0D4E8;transition:.2s}
.album-dot.active{background:var(--fuji);width:14px;border-radius:3px}
.album-dot.green{background:#B7E4C7}
.album-dot.green.active{background:#2D6A4F}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 8px 8px}
.tag{font-size:12px;font-weight:700;border-radius:10px;padding:4px 10px}
.tag-eat{background:#FEF3E2;color:#D07020}
.tag-buy{background:#FCE8EC;color:#C03050}
.tag-photo{background:#E3EEF8;color:#1060A0}
.tag-tip{background:#E8F4E8;color:#207030}
.tips-box{margin:8px 0 4px 8px;display:flex;flex-direction:column;gap:6px}
.tip-row{background:#F0F6FF;border-radius:10px;padding:9px 12px;font-size:14px;color:#3B6FA0;display:flex;gap:6px;align-items:flex-start}
.tip-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.map-btn{display:flex;align-items:center;gap:5px;background:var(--fuji);color:#fff;border:none;border-radius:12px;padding:9px 14px;font-family:'Zen Maru Gothic',sans-serif;font-size:14px;cursor:pointer;text-decoration:none;justify-content:center;margin:10px 0 0 8px;width:calc(100% - 8px)}
body.guide-mode .map-btn{background:var(--guide)}
.more-link{display:inline-flex;align-items:center;gap:4px;margin:8px 0 0 8px;font-size:14px;color:var(--fuji);cursor:pointer;font-weight:700;background:none;border:none;font-family:'Zen Maru Gothic',sans-serif;padding:0;text-decoration:underline;text-underline-offset:3px}
body.guide-mode .more-link{color:var(--guide)}
.food-carousel-wrap{flex:1;min-width:0}
.food-carousel{display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 6px}
.food-carousel::-webkit-scrollbar{display:none}
.food-card{flex-shrink:0;width:calc(100% - 4px);scroll-snap-align:start;background:#fff;border-radius:16px;border:1.5px solid #eef0f4;overflow:hidden;position:relative}
.food-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;background:#F4A261}
.food-card-img{width:100%;height:clamp(120px,28vw,180px);object-fit:cover;display:block}
.food-card-body{padding:12px 14px}
.food-card-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.food-card-name{font-size:16px;font-weight:700;color:#2d3a4a;flex:1;line-height:1.3}
.food-card-desc{font-size:14px;color:#666;line-height:1.6;margin-bottom:6px}
.food-card-desc:empty{display:none;margin:0;padding:0}
.food-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.food-nav-btn{background:var(--fuji);color:#fff;border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
body.guide-mode .food-nav-btn{background:var(--guide)}
.food-nav-btn:disabled{background:#ddd;cursor:default}
.food-nav-dots{display:flex;gap:5px}
.food-nav-dot{width:6px;height:6px;border-radius:50%;background:#dce8f4}
.food-nav-dot.active{background:var(--fuji);width:16px;border-radius:3px}
body.guide-mode .food-nav-dot.active{background:var(--guide)}
.mv-carousel-wrap{flex:1;min-width:0;position:relative}
.mv-carousel{display:flex;overflow-x:auto;gap:0;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0}
.mv-carousel::-webkit-scrollbar{display:none}
.mv-slide{flex-shrink:0;width:100%;scroll-snap-align:start}
.mv-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}
.mv-nav-btn{background:var(--fuji);color:#fff;border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
body.guide-mode .mv-nav-btn{background:var(--guide)}
.mv-nav-btn:disabled{background:#ddd;cursor:default}
.mv-nav-dots{display:flex;gap:5px}
.mv-nav-dot{width:6px;height:6px;border-radius:50%;background:#dce8f4;transition:.2s}
.mv-nav-dot.active{background:var(--fuji);width:16px;border-radius:3px}
body.guide-mode .mv-nav-dot.active{background:var(--guide)}
.mv-counter{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:3px 8px;pointer-events:none;z-index:2}
.todo-day-selector{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.todo-day-selector::-webkit-scrollbar{display:none}
.todo-day-btn{flex-shrink:0;background:#fff;border:2px solid #e0e4ea;border-radius:20px;padding:8px 16px;font-family:'Zen Maru Gothic',sans-serif;font-size:14px;cursor:pointer;color:#666;white-space:nowrap;line-height:1.4}
.todo-day-btn.active{background:var(--guide);border-color:var(--guide);color:#fff;font-weight:700}
.todo-panel{display:none}
.todo-panel.active{display:block}
.todo-section{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1.5px solid #B7E4C7}
.todo-title{font-size:15px;font-weight:700;color:var(--guide);margin-bottom:10px}
.todo-progress{background:#E8F5EE;border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.todo-progress-bar{flex:1;height:6px;background:#C7EAD4;border-radius:3px;overflow:hidden}
.todo-progress-fill{height:100%;background:var(--guide);border-radius:3px;transition:.4s}
.todo-progress-text{font-size:12px;color:var(--guide);font-weight:700;white-space:nowrap}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #f0f4f0;cursor:pointer}
.todo-item:last-child{border-bottom:none}
.todo-check{width:22px;height:22px;border-radius:6px;border:2px solid #B7E4C7;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.todo-item.done .todo-check{background:var(--guide);border-color:var(--guide)}
.todo-item.done .todo-check::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
.todo-text{font-size:14px;color:#2d3a4a;line-height:1.5}
.todo-item.done .todo-text{color:#aaa;text-decoration:line-through}
.guide-section{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1.5px solid #eef0f4}
.guide-title{font-size:16px;font-weight:700;color:var(--fuji);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.guide-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f0f2f4;font-size:16px;color:#555;align-items:flex-start}
.guide-item:last-child{border-bottom:none}
.guide-item-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.guide-item strong{color:#2d3a4a;display:block;font-size:14px}
.guide-item-text{white-space:pre-line;font-size:16px;line-height:1.8}
/* ── DAILY GUIDE ── */
.daily-header-card{background:linear-gradient(135deg,#3B6FA0,#5B8FC0);border-radius:16px;padding:16px 20px;margin-bottom:14px;color:#fff;display:flex;flex-direction:column;gap:8px}
body.guide-mode .daily-header-card{background:linear-gradient(135deg,#2D6A4F,#52B788)}
.daily-date-row{font-size:15px;font-weight:700;opacity:.95}
.daily-weather-row{display:flex;align-items:center;gap:10px;font-weight:700}
.daily-weather-row .dw-icon{font-size:28px}
.daily-weather-row .dw-temp{font-size:22px}
.daily-weather-row .dw-rain{font-size:18px}
.dw-divider{opacity:.5;font-weight:300;font-size:18px}
.daily-section{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1.5px solid #eef0f4}
.daily-section-title{font-size:15px;font-weight:700;color:var(--fuji);margin-bottom:10px}
body.guide-mode .daily-section-title{color:var(--guide)}
.daily-list-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f0f2f4;font-size:16px;color:#444;line-height:1.6}
.daily-list-item:last-child{border-bottom:none}
.daily-list-dot{width:7px;height:7px;border-radius:50%;background:var(--fuji);flex-shrink:0;margin-top:7px}
body.guide-mode .daily-list-dot{background:var(--guide)}
.daily-empty{text-align:center;padding:24px 0;color:#aaa;font-size:15px}
/* font size levels */
body.fs-1 .time-badge{font-size:16px}
body.fs-1 .cat-badge{font-size:13px}
body.fs-1 .spot-name{font-size:18px}
body.fs-1 .spot-desc{font-size:18px;line-height:1.9}
body.fs-1 .tag{font-size:14px}
body.fs-1 .food-card-name{font-size:18px}
body.fs-1 .food-card-desc{font-size:18px;line-height:1.9}
body.fs-1 .guide-title{font-size:18px}
body.fs-1 .guide-item{font-size:18px}
body.fs-1 .guide-item strong{font-size:18px}
body.fs-1 .guide-item-text{font-size:18px;line-height:1.9}
body.fs-1 .daily-list-item{font-size:18px}
body.fs-2 .time-badge{font-size:18px}
body.fs-2 .cat-badge{font-size:15px}
body.fs-2 .spot-name{font-size:21px}
body.fs-2 .spot-desc{font-size:21px;line-height:2}
body.fs-2 .tag{font-size:16px}
body.fs-2 .food-card-name{font-size:21px}
body.fs-2 .food-card-desc{font-size:21px;line-height:2}
body.fs-2 .guide-title{font-size:21px}
body.fs-2 .guide-item{font-size:21px}
body.fs-2 .guide-item strong{font-size:21px}
body.fs-2 .guide-item-text{font-size:21px;line-height:2}
body.fs-2 .daily-list-item{font-size:21px}
@keyframes ripple{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.header-icon.clicked{animation:ripple .15s ease}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="loader-spinner" id="loader-spinner"></div>
  <div style="font-size:16px;color:#555;font-weight:500;" id="loading-text">🌍 正在從 Google Sheets 載入自由行資料…</div>
  <div class="error-card" id="error-card" style="display:none;">
    <div style="font-size:40px;margin-bottom:12px">📡</div>
    <div style="font-size:18px;font-weight:700;color:#d9534f;margin-bottom:8px">資料庫讀取失敗</div>
    <div style="font-size:14px;color:#555;line-height:1.6;text-align:left;background:#fcf8e3;border:1px solid #faebcc;padding:12px;border-radius:10px;margin:12px 0;" id="error-message">無法連結至雲端資料庫。</div>
    <div style="font-size:12px;color:#777;margin-bottom:16px;text-align:left;">💡 <b>提示：</b>請確認 Google Apps Script 部署時的<b>「誰有存取權」</b>有設為<b>「所有人 (Anyone)」</b>。</div>
    <button class="retry-btn" onclick="retryConnection()">🔄 重新連線</button>
  </div>
</div>

<div class="modal-overlay" id="switchModal">
  <div class="modal">
    <div class="modal-icon" id="modalIcon">🗺️</div>
    <div class="modal-title" id="modalTitle">切換到導遊版本？</div>

<script>
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz0nIFdtMcWDsBB3hP-wN2QyS88P6OWlXl6AfbbxrKfJGchQvwc9KFt0KqLWadkeuBZ/exec";
let cachedTripData = null;
const CACHE_KEY = 'tripData_okayama_v3';
const CACHE_TTL = 60 * 60 * 1000;

async function loadTripData() {
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      const { data, timestamp } = JSON.parse(cached);
      if (Date.now() - timestamp < CACHE_TTL) {
        renderAll(data);
        document.getElementById('loading-overlay').style.display = 'none';
        fetchAndCache(true);
        return;
      }
    }
  } catch(e) {}
  fetchAndCache(false);
}

async function fetchAndCache(silent) {
  try {
    const res = await fetch(GAS_API_URL);
    if (!res.ok) throw new Error(`HTTP 錯誤! 狀態碼: ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(`雲端指令碼錯誤: ${data.error}`);

    const strFields = {
      tour: ['start_time','end_time','spot_title','category','image_url','description','tip','tag','more_text','more_img','map_url','guide_text','guide_img'],
      info: ['Day','Daytitle','Daytext'],
      gbook: ['gbook_title','gbook_subtitle','gbook_subemoji','gbook_text'],
      todo: ['todo_day','todo_list'],
      daily: ['daily_date','daily_notice','daily_todo','daily_thing']
    };
    for (const [key, fields] of Object.entries(strFields)) {
      if (data[key] && Array.isArray(data[key])) {
        data[key].forEach(item => fields.forEach(f => {
          item[f] = (item[f] !== undefined && item[f] !== null) ? String(item[f]) : '';
        }));
      }
    }
    cachedTripData = data;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ data, timestamp: Date.now() })); } catch(e) {}
    if (!silent) {
      renderAll(data);
      document.getElementById('loading-overlay').style.opacity = '0';
      setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; }, 300);
    }
  } catch (error) {
    if (silent) return;
    console.error("資料載入失敗:", error);
    document.getElementById('loader-spinner').style.display = 'none';
    document.getElementById('loading-text').style.display = 'none';
    document.getElementById('error-card').style.display = 'block';
    document.getElementById('error-message').textContent = error.message;
  }
}

function renderAll(data) {
  cachedTripData = data;
  renderDaySelector(data.info);
  renderItinerary(data.info, data.tour);
  renderGuideBook(data.gbook);
  renderTodoList(data.info, data.todo);
  renderDailyGuide(data.daily || []);
  loadWeather(); // 天氣只在這裡呼叫一次
}

function retryConnection() {
  document.getElementById('error-card').style.display = 'none';
  document.getElementById('loader-spinner').style.display = 'block';
  document.getElementById('loading-text').style.display = 'block';
  loadTripData();
}

// ── helpers ───────────────────────────────────────
function splitPipe(str) { return str ? str.split('|').map(s => s.trim()) : ['']; }
function isMultiValue(item) { return splitPipe(item.spot_title).length > 1; }
function descHtml(desc, extraClass='') {
  if (!desc || !desc.trim()) return '';
  return `<div class="spot-desc${extraClass?' '+extraClass:''}">${desc}</div>`;
}
function cardImgHtml(url, title, cssClass, height) {
  const urls = url ? url.split('|').map(s=>s.trim()).filter(s=>s) : [];
  if (!urls.length) return '';
  if (urls.length===1) return `<img class="${cssClass}" src="${urls[0]}" alt="${title}" style="height:${height}px" onerror="this.style.display='none'">`;
  return createMiniAlbum(urls, false);
}

// ── DAY SELECTOR ──────────────────────────────────
function renderDaySelector(info) {
  const c = document.getElementById('day-selector-container');
  c.innerHTML = '';
  info.forEach((item, idx) => {
    const dm = item.Daytext ? item.Daytext.match(/(\d+\/\d+)/) : null;
    const ds = dm ? dm[0] : '';
    const btn = document.createElement('button');
    btn.className = `day-btn ${idx===0?'active':''}`;
    btn.onclick = e => switchDay(item.Day, e.currentTarget);
    btn.innerHTML = `Day ${item.Day}<br><span style="font-size:11px">${ds}</span>`;
    c.appendChild(btn);
  });
}

// ── ITINERARY ─────────────────────────────────────
function renderItinerary(info, tour) {
  const container = document.getElementById('day-panels-container');
  container.innerHTML = '';
  info.forEach((dayInfo, idx) => {
    const panel = document.createElement('div');
    panel.className = `day-panel ${idx===0?'active':''}`;
    panel.id = `day-${dayInfo.Day}`;
    panel.innerHTML = `
      <div class="day-header">
        <div class="day-badge">Day<br>${dayInfo.Day}</div>
        <div class="day-info"><h2>${dayInfo.Daytitle||''}</h2><p>${dayInfo.Daytext||''}</p></div>
      </div>
      <div class="timeline-container" id="timeline-day-${dayInfo.Day}"></div>`;
    container.appendChild(panel);
  });
  const groupedTour = {};
  tour.forEach(item => {
    const key = `day_${item.tour_day}_time_${item.start_time||''}_${item.end_time||''}`;
    if (!groupedTour[key]) groupedTour[key] = [];
    groupedTour[key].push(item);
  });
  Object.keys(groupedTour).sort((a,b) => {
    const t = k => k.split('_time_')[1]?.split('_')[0]||'';
    return t(a).localeCompare(t(b));
  }).forEach(key => {
    const group = groupedTour[key];
    if (!group.length) return;
    const day = group[0].tour_day;
    const tlc = document.getElementById(`timeline-day-${day}`);
    if (!tlc) return;
    const ti = document.createElement('div');
    ti.className = 'timeline-item';
    const tc = document.createElement('div');
    tc.className = 'time-col';
    tc.innerHTML = `<div class="time-badge">${group[0].start_time||''}<br>↓<br>${group[0].end_time||''}</div><div class="time-line"></div>`;
    ti.appendChild(tc);
    let cardEl;
    if (group.length===1 && isMultiValue(group[0])) cardEl = createMultiValueCarousel(group[0]);
    else if (group.length>1) cardEl = createCarouselCard(group, `food-d${day}-${(group[0].start_time||'').replace(':','')}`);
    else cardEl = createSpotCard(group[0]);
    ti.appendChild(cardEl);
    tlc.appendChild(ti);
  });
}

// ── MULTI-VALUE CAROUSEL ──────────────────────────
function createMultiValueCarousel(item) {
  const titles=splitPipe(item.spot_title), descs=splitPipe(item.description);
  const tags=splitPipe(item.tag), maps=splitPipe(item.map_url);
  const imgs=splitPipe(item.image_url), cats=splitPipe(item.category);
  const count=titles.length;
  const uid='mv-'+Math.random().toString(36).slice(2,7);
  const wrap=document.createElement('div');
  wrap.className='mv-carousel-wrap';
  const badge=document.createElement('div');
  badge.className='mv-counter'; badge.id=`${uid}-badge`; badge.textContent=`1 / ${count}`;
  wrap.appendChild(badge);
  const carousel=document.createElement('div');
  carousel.className='mv-carousel'; carousel.id=uid;
  for (let i=0;i<count;i++) {
    const slide=document.createElement('div'); slide.className='mv-slide';
    const titleI=titles[i]||'', descI=descs[i]||descs[0]||'', tagI=tags[i]||tags[0]||'';
    const mapI=maps[i]||maps[0]||'', imgI=imgs[i]||imgs[0]||'', catI=cats[i]||cats[0]||'';
    const card=document.createElement('div');
    card.className=`spot-card ${getCardTypeClass(catI)}`;
    const catClass=getCategoryBadgeClass(catI);
    const catBadgeHtml=catI.trim()?`<span class="cat-badge ${catClass}">${catI}</span>`:'';
    let tipsHtml='';
    if (item.tip&&item.tip.trim()) tipsHtml=`<div class="tips-box">${item.tip.split('|').map(t=>`<div class="tip-row"><span class="tip-icon">💡</span>${t.trim()}</div>`).join('')}</div>`;
    let tagsHtml='';
    if (tagI.trim()) tagsHtml=`<div class="tags">${tagI.split(',').map(t=>`<span class="tag ${getTagStyleClass(t)}">${t.trim()}</span>`).join('')}</div>`;
    let moreImgHtml=(item.more_img&&item.more_img.trim())?createMiniAlbum(item.more_img.split('|'),false):'';
    const hasMore=(item.more_text&&item.more_text.trim())||moreImgHtml;
    const moreLinkHtml=hasMore?`<button class="more-link" onclick="toggleMore(this)">📖 了解更多 ▾</button><div class="more-panel"><div class="more-inner">${item.more_text?`<div class="more-text">${item.more_text}</div>`:''}${moreImgHtml}</div></div>`:'';
    let guideImgHtml=(item.guide_img&&item.guide_img.trim())?createMiniAlbum(item.guide_img.split('|'),true):'';
    const hasGuide=(item.guide_text&&item.guide_text.trim())||guideImgHtml;
    const guideBtnHtml=hasGuide?`<button class="icon-btn guide-only" onclick="toggleGuide(this)">📋</button>`:'';
    const guidePanelHtml=hasGuide?`<div class="guide-panel"><div class="guide-inner">${item.guide_text?`<div class="guide-note-text">${item.guide_text}</div>`:''}${guideImgHtml}</div></div>`:'';
    const mapBtnHtml=mapI.trim()?`<a class="map-btn" href="${mapI}" target="_blank">🗺 Google Maps 導航</a>`:'';
    card.innerHTML=`${cardImgHtml(imgI,titleI,'card-img',160)}<div class="spot-header"><div class="spot-header-left">${catBadgeHtml}<span class="spot-name">${titleI}</span></div><div class="spot-header-btns">${guideBtnHtml}</div></div>${descHtml(descI)}${tagsHtml}${tipsHtml}${moreLinkHtml}${guidePanelHtml}${mapBtnHtml}`;
    slide.appendChild(card); carousel.appendChild(slide);
  }
  wrap.appendChild(carousel);
  const dotsHtml=Array.from({length:count},(_,i)=>`<div class="mv-nav-dot ${i===0?'active':''}"></div>`).join('');
  const nav=document.createElement('div'); nav.className='mv-nav'; nav.id=`${uid}-nav`;
  nav.innerHTML=`<button class="mv-nav-btn" id="${uid}-prev" onclick="mvScroll('${uid}',-1)" disabled>‹</button><div class="mv-nav-dots" id="${uid}-dots">${dotsHtml}</div><button class="mv-nav-btn" id="${uid}-next" onclick="mvScroll('${uid}',1)" ${count<=1?'disabled':''}>›</button>`;
  wrap.appendChild(nav);
  carousel.addEventListener('scroll',()=>mvSync(uid,count),{passive:true});
  return wrap;
}
function mvScroll(uid,dir){const el=document.getElementById(uid);el.scrollBy({left:dir*el.querySelector('.mv-slide').offsetWidth,behavior:'smooth'});}
function mvSync(uid,count){
  const el=document.getElementById(uid);
  const slideW=el.querySelector('.mv-slide')?.offsetWidth||1;
  const idx=Math.round(el.scrollLeft/slideW);
  document.querySelectorAll(`#${uid}-dots .mv-nav-dot`).forEach((d,i)=>d.classList.toggle('active',i===idx));
  const p=document.getElementById(`${uid}-prev`), n=document.getElementById(`${uid}-next`);
  if(p)p.disabled=idx===0; if(n)n.disabled=idx>=count-1;
  const b=document.getElementById(`${uid}-badge`); if(b)b.textContent=`${idx+1} / ${count}`;
}

// ── FOOD CAROUSEL ─────────────────────────────────
function createCarouselCard(items, carouselId) {
  const wrap=document.createElement('div'); wrap.className='food-carousel-wrap';
  const carousel=document.createElement('div'); carousel.className='food-carousel'; carousel.id=carouselId;
  carousel.setAttribute('onscroll',`syncFoodNav(this,'fn-${carouselId}')`);
  items.forEach(item => {
    const card=document.createElement('div'); card.className='food-card';
    const catClass=getCategoryBadgeClass(item.category);
    const catBadgeHtml=(item.category&&item.category.trim())?`<span class="cat-badge ${catClass}">${item.category}</span>`:'';
    let tipsHtml='';
    if(item.tip&&item.tip.trim()) tipsHtml=`<div class="tips-box">${item.tip.split('|').map(t=>`<div class="tip-row"><span class="tip-icon">💡</span>${t.trim()}</div>`).join('')}</div>`;
    let tagsHtml='';
    if(item.tag&&item.tag.trim()) tagsHtml=`<div class="tags">${item.tag.split('|').map(t=>`<span class="tag ${getTagStyleClass(t)}">${t.trim()}</span>`).join('')}</div>`;
    let moreImgHtml=(item.more_img&&item.more_img.trim())?createMiniAlbum(item.more_img.split('|'),false):'';
    const hasMore=(item.more_text&&item.more_text.trim())||moreImgHtml;
    const moreLinkHtml=hasMore?`<button class="more-link" onclick="toggleMore(this)">📖 了解更多 ▾</button><div class="more-panel"><div class="more-inner">${item.more_text?`<div class="more-text">${item.more_text}</div>`:''}${moreImgHtml}</div></div>`:'';
    let guideImgHtml=(item.guide_img&&item.guide_img.trim())?createMiniAlbum(item.guide_img.split('|'),true):'';
    const hasGuide=(item.guide_text&&item.guide_text.trim())||guideImgHtml;
    const guideBtnHtml=hasGuide?`<button class="icon-btn guide-only" onclick="toggleGuide(this)">📋</button>`:'';
    const guidePanelHtml=hasGuide?`<div class="guide-panel"><div class="guide-inner">${item.guide_text?`<div class="guide-note-text">${item.guide_text}</div>`:''}${guideImgHtml}</div></div>`:'';
    const mapBtnHtml=(item.map_url&&item.map_url.trim())?`<a class="map-btn" href="${item.map_url}" target="_blank">🗺 導航</a>`:'';
    card.innerHTML=`${cardImgHtml(item.image_url,item.spot_title,'food-card-img',150)}<div class="food-card-body"><div class="food-card-header">${catBadgeHtml}<span class="food-card-name">${item.spot_title||''}</span><div class="spot-header-btns">${guideBtnHtml}</div></div>${descHtml(item.description,'food-card-desc')}${tagsHtml}${tipsHtml}${moreLinkHtml}${guidePanelHtml}${mapBtnHtml}</div>`;
    carousel.appendChild(card);
  });
  const dotsHtml=items.map((_,i)=>`<div class="food-nav-dot ${i===0?'active':''}"></div>`).join('');
  const nav=document.createElement('div'); nav.className='food-nav'; nav.id=`fn-${carouselId}`;
  nav.innerHTML=`<button class="food-nav-btn" onclick="scrollFood('${carouselId}',-1,'fn-${carouselId}')" disabled>‹</button><div class="food-nav-dots">${dotsHtml}</div><button class="food-nav-btn" onclick="scrollFood('${carouselId}',1,'fn-${carouselId}')">›</button>`;
  wrap.appendChild(carousel); wrap.appendChild(nav);
  return wrap;
}

// ── SINGLE SPOT CARD ─────────────────────────────
function createSpotCard(item) {
  const card=document.createElement('div'); card.className=`spot-card ${getCardTypeClass(item.category)}`;
  const catClass=getCategoryBadgeClass(item.category);
  const catBadgeHtml=(item.category&&item.category.trim())?`<span class="cat-badge ${catClass}">${item.category}</span>`:'';
  let tipsHtml='';
  if(item.tip&&item.tip.trim()) tipsHtml=`<div class="tips-box">${item.tip.split('|').map(t=>`<div class="tip-row"><span class="tip-icon">💡</span>${t.trim()}</div>`).join('')}</div>`;
  let tagsHtml='';
  if(item.tag&&item.tag.trim()) tagsHtml=`<div class="tags">${item.tag.split('|').map(t=>`<span class="tag ${getTagStyleClass(t)}">${t.trim()}</span>`).join('')}</div>`;
  let moreImgHtml=(item.more_img&&item.more_img.trim())?createMiniAlbum(item.more_img.split('|'),false):'';
  const hasMore=(item.more_text&&item.more_text.trim())||moreImgHtml;
  const moreLinkHtml=hasMore?`<button class="more-link" onclick="toggleMore(this)">📖 了解更多 ▾</button><div class="more-panel"><div class="more-inner">${item.more_text?`<div class="more-text">${item.more_text}</div>`:''}${moreImgHtml}</div></div>`:'';
  let guideImgHtml=(item.guide_img&&item.guide_img.trim())?createMiniAlbum(item.guide_img.split('|'),true):'';
  const hasGuide=(item.guide_text&&item.guide_text.trim())||guideImgHtml;
  const guideBtnHtml=hasGuide?`<button class="icon-btn guide-only" onclick="toggleGuide(this)" title="導遊備註">📋</button>`:'';
  const guidePanelHtml=hasGuide?`<div class="guide-panel"><div class="guide-inner">${item.guide_text?`<div class="guide-note-text">${item.guide_text}</div>`:''}${guideImgHtml}</div></div>`:'';
  const mapBtnHtml=(item.map_url&&item.map_url.trim())?`<a class="map-btn" href="${item.map_url}" target="_blank">🗺 Google Maps 導航</a>`:'';
  card.innerHTML=`${cardImgHtml(item.image_url,item.spot_title,'card-img',160)}<div class="spot-header"><div class="spot-header-left">${catBadgeHtml}<span class="spot-name">${item.spot_title||''}</span></div><div class="spot-header-btns">${guideBtnHtml}</div></div>${descHtml(item.description)}${tagsHtml}${tipsHtml}${moreLinkHtml}${guidePanelHtml}${mapBtnHtml}`;
  return card;
}

// ── MINI ALBUM ────────────────────────────────────
function createMiniAlbum(imgUrls, isGuide=false) {
  const allUrls=imgUrls.map(u=>u.trim()).filter(u=>u);
  if(!allUrls.length) return '';
  const albumId='album-'+Math.random().toString(36).slice(2,8);
  const dotColorClass=isGuide?'green':'';
  const slidesHtml=allUrls.map((url,idx)=>`<div class="album-slide" data-album="${albumId}" data-idx="${idx}" style="cursor:zoom-in"><img src="${url}" alt="景點細節" style="pointer-events:none" onerror="this.parentElement.style.background='#eee';this.style.display='none'"></div>`).join('');
  const dotsHtml=allUrls.map((_,idx)=>`<div class="album-dot ${dotColorClass} ${idx===0?'active':''}"></div>`).join('');
  const label=isGuide?'<div class="album-label green">🗺 導遊相簿</div>':'';
  setTimeout(()=>{document.querySelectorAll(`.album-slide[data-album="${albumId}"]`).forEach(el=>{el.addEventListener('click',()=>openLightbox(allUrls,parseInt(el.dataset.idx)));});},0);
  return `${label}<div class="album-scroll">${slidesHtml}</div><div class="album-dots">${dotsHtml}</div>`;
}
function openLightbox(urls,startIdx){
  let cur=startIdx;
  const overlay=document.createElement('div');
  overlay.id='lightbox';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px';
  overlay.onclick=e=>{if(e.target===overlay)closeLightbox();};
  function render(){overlay.innerHTML=`<button onclick="closeLightbox()" style="position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;z-index:1">✕</button><div style="display:flex;align-items:center;gap:10px;width:100%;justify-content:center;padding:0 16px"><button onclick="lbNav(-1)" style="background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer;flex-shrink:0" ${cur===0?'disabled style="opacity:.3"':''}>‹</button><img src="${urls[cur]}" style="max-width:calc(100vw - 100px);max-height:75vh;border-radius:10px;object-fit:contain;display:block"><button onclick="lbNav(1)" style="background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer;flex-shrink:0" ${cur===urls.length-1?'disabled style="opacity:.3"':''}>›</button></div><div style="color:rgba(255,255,255,.6);font-size:13px">${cur+1} / ${urls.length}</div>`;}
  window.lbNav=dir=>{cur=Math.max(0,Math.min(urls.length-1,cur+dir));render();};
  render(); document.body.appendChild(overlay);
}
function closeLightbox(){const lb=document.getElementById('lightbox');if(lb)lb.remove();}

// ── GUIDE BOOK ────────────────────────────────────
function renderGuideBook(gbook) {
  const container=document.getElementById('family-guide'); container.innerHTML='';
  const sections={};
  gbook.forEach(item=>{const t=item.gbook_title||'其他資訊';if(!sections[t])sections[t]=[];sections[t].push(item);});
  for(const title in sections){
    const sec=document.createElement('div'); sec.className='guide-section';
    sec.innerHTML=`<div class="guide-title">${title}</div>`+sections[title].map(item=>`<div class="guide-item"><span class="guide-item-icon">${item.gbook_subemoji||'📌'}</span><div><strong>${item.gbook_subtitle||''}</strong><span class="guide-item-text">${item.gbook_text||''}</span></div></div>`).join('');
    container.appendChild(sec);
  }
}

// ── TODO ──────────────────────────────────────────
function renderTodoList(info, todo) {
  const dayContainer=document.getElementById('todo-day-selector-container'); dayContainer.innerHTML='';
  info.forEach((item,idx)=>{
    const btn=document.createElement('button');
    btn.className=`todo-day-btn ${idx===0?'active':''}`;
    btn.onclick=e=>switchTodoDay(item.Day,e.currentTarget);
    btn.innerHTML=`Day ${item.Day}<br><span style="font-size:11px">9/${26+parseInt(item.Day)}</span>`;
    dayContainer.appendChild(btn);
  });
  const panelContainer=document.getElementById('todo-panels-container'); panelContainer.innerHTML='';
  info.forEach((dayInfo,idx)=>{
    const panel=document.createElement('div');
    panel.className=`todo-panel ${idx===0?'active':''}`;
    panel.id=`todo-${dayInfo.Day}`;
    const dayTodos=todo.filter(t=>parseInt(t.todo_day)===parseInt(dayInfo.Day));
    const itemsHtml=dayTodos.length===0?`<div style="font-size:13px;color:#95C8A8;font-style:italic;text-align:center;padding:12px 0;">🎉 本日尚無規劃待辦事項！</div>`:dayTodos.map(item=>`<div class="todo-item" onclick="toggleTodo(this)"><div class="todo-check"></div><div class="todo-text">${item.todo_list||''}</div></div>`).join('');
    panel.innerHTML=`<div class="todo-section"><div class="todo-title">✅ Day ${dayInfo.Day} 待辦清單</div><div class="todo-progress"><div class="todo-progress-bar"><div class="todo-progress-fill" style="width:0%"></div></div><span class="todo-progress-text">0 / ${dayTodos.length} 完成</span></div><div class="todo-items-list">${itemsHtml}</div></div>`;
    panelContainer.appendChild(panel);
    if(dayTodos.length>0){const first=panel.querySelector('.todo-item');if(first)toggleTodo(first,true);}
  });
}

// ── DAILY GUIDE ───────────────────────────────────
function renderDailyGuide(daily) {
  const now = new Date();
  const weekdays = ['日','一','二','三','四','五','六'];
  const dateStr = `${now.getMonth()+1}/${now.getDate()}`;
  document.getElementById('daily-date-row').textContent = `📅 今日：${dateStr}（週${weekdays[now.getDay()]}）`;

  const todayData = daily.find(item => (item.daily_date||'').trim() === dateStr);
  const container = document.getElementById('daily-content');
  container.innerHTML = '';

  if (!todayData) {
    container.innerHTML = `<div class="daily-empty">📭 今日（${dateStr}）無每日指南資料</div>`;
    return;
  }
  const sections = [
    { key:'daily_notice', title:'⚠️ 注意事項' },
    { key:'daily_todo',   title:'✅ 待辦事項' },
    { key:'daily_thing',  title:'🎒 攜帶物品' },
  ];
  sections.forEach(({key, title}) => {
    const raw = (todayData[key]||'').trim();
    if (!raw) return;
    const items = raw.split('|').map(s=>s.trim()).filter(s=>s);
    if (!items.length) return;
    const sec = document.createElement('div'); sec.className='daily-section';
    sec.innerHTML = `<div class="daily-section-title">${title}</div>`+items.map(t=>`<div class="daily-list-item"><div class="daily-list-dot"></div><div>${t}</div></div>`).join('');
    container.appendChild(sec);
  });
  if (!container.children.length) container.innerHTML=`<div class="daily-empty">今日無注意事項、待辦或攜帶物品資料</div>`;
}

// ── WEATHER ───────────────────────────────────────
const WMO_ICON={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',51:'🌦',53:'🌦',55:'🌧',61:'🌧',63:'🌧',65:'🌧',80:'🌦',81:'🌧',82:'⛈',95:'⛈'};
async function loadWeather() {
  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.6617&longitude=133.9344&current=temperature_2m,weather_code,precipitation_probability&timezone=Asia%2FTokyo');
    const d = await r.json();
    const c = d.current;
    const iconEl=document.getElementById('dw-icon');
    const tempEl=document.getElementById('dw-temp');
    const rainEl=document.getElementById('dw-rain');
    if(iconEl) iconEl.textContent=WMO_ICON[c.weather_code]||'🌡';
    if(tempEl) tempEl.textContent=Math.round(c.temperature_2m)+'°C';
    if(rainEl) rainEl.textContent=(c.precipitation_probability||0)+'%';
  } catch(e) {
    const tempEl=document.getElementById('dw-temp');
    if(tempEl) tempEl.textContent='無法取得';
  }
}

// ── CLASSIFIERS ───────────────────────────────────
function getCardTypeClass(c){
  if(!c)return 'type-sight';
  if(c.includes('食')||c.includes('吃')||c.includes('餐'))return 'type-food';
  if(c.includes('住')||c.includes('旅'))return 'type-hotel';
  if(c.includes('行')||c.includes('交'))return 'type-transport';
  if(c.includes('購')||c.includes('買')||c.includes('店'))return 'type-shop';
  if(c.includes('動')||c.includes('活')||c.includes('藝'))return 'type-activity';
  return 'type-sight';
}
function getCategoryBadgeClass(c){
  if(!c)return 'cat-sight';
  if(c.includes('食')||c.includes('吃')||c.includes('餐'))return 'cat-food';
  if(c.includes('住')||c.includes('旅'))return 'cat-hotel';
  if(c.includes('行')||c.includes('交'))return 'cat-transport';
  if(c.includes('購')||c.includes('買')||c.includes('店'))return 'cat-shop';
  if(c.includes('動')||c.includes('活')||c.includes('藝'))return 'cat-activity';
  return 'cat-sight';
}
function getTagStyleClass(t){
  if(!t)return '';
  if(t.includes('吃')||t.includes('食')||t.includes('飲'))return 'tag-eat';
  if(t.includes('買')||t.includes('購')||t.includes('禮'))return 'tag-buy';
  if(t.includes('照')||t.includes('景')||t.includes('拍'))return 'tag-photo';
  return 'tag-tip';
}

// ── MODE / FONT ───────────────────────────────────
let clickCount=0, clickTimer=null, isGuideMode=false, fontSizeLevel=0;
const FS_LABELS=['一般字體','中等字體','大型字體'];
function cycleFontSize(){
  document.body.classList.remove('fs-1','fs-2');
  fontSizeLevel=(fontSizeLevel+1)%3;
  if(fontSizeLevel>0)document.body.classList.add('fs-'+fontSizeLevel);
  document.getElementById('fontSizeLabel').textContent=FS_LABELS[fontSizeLevel];
  document.getElementById('fontSizeBtn').style.background=fontSizeLevel===0?'rgba(255,255,255,.2)':fontSizeLevel===1?'rgba(255,255,255,.35)':'rgba(255,255,255,.55)';
}
function handleIconClick(){
  const icon=document.getElementById('headerIcon');
  icon.classList.remove('clicked');void icon.offsetWidth;icon.classList.add('clicked');
  clickCount++;clearTimeout(clickTimer);
  clickTimer=setTimeout(()=>{clickCount=0;},2000);
  if(clickCount>=5){clickCount=0;clearTimeout(clickTimer);showModal();}
}
function showModal(){
  document.getElementById('modalIcon').textContent=isGuideMode?'👨‍👩‍👧':'🗺️';
  document.getElementById('modalTitle').textContent=isGuideMode?'切換回家庭旅遊版？':'切換到導遊版本？';
  document.getElementById('modalDesc').textContent=isGuideMode?'將隱藏導遊備註，切換回家人閱覽模式。':'導遊版本包含每日待辦清單與詳細備註，僅供帶路人使用。';
  document.getElementById('modalConfirm').classList.toggle('to-family',isGuideMode);
  document.getElementById('switchModal').classList.add('show');
}
function closeModal(){document.getElementById('switchModal').classList.remove('show');}
function confirmSwitch(){
  closeModal();isGuideMode=!isGuideMode;
  document.body.classList.toggle('guide-mode',isGuideMode);
  document.getElementById('modeBadge').textContent=isGuideMode?'🗺️ 導遊專用版':'👨‍👩‍👧 家庭旅遊版';
  document.getElementById('headerSubtitle').textContent=isGuideMode?'Guide Mode — 導遊專用':'Okayama Trip';
  document.getElementById('family-guide').style.display=isGuideMode?'none':'block';
  document.getElementById('guide-todo').style.display=isGuideMode?'block':'none';
  document.getElementById('guideTabIcon').textContent=isGuideMode?'✅':'📖';
  document.getElementById('guideTabLabel').textContent=isGuideMode?'待辦':'航班/住宿';
}

// ── TABS / DAYS ───────────────────────────────────
function switchTab(tab){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
}
function switchDay(day,btn){
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.day-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');document.getElementById('day-'+day).classList.add('active');
}
function switchTodoDay(day,btn){
  document.querySelectorAll('.todo-day-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.todo-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');document.getElementById('todo-'+day).classList.add('active');
}
function toggleMore(btn){
  const card=btn.closest('.spot-card,.food-card,.mv-slide');
  const panel=card.querySelector('.more-panel');
  btn.textContent=panel.classList.toggle('open')?'📖 收起 ▴':'📖 了解更多 ▾';
}
function toggleGuide(btn){
  const card=btn.closest('.spot-card,.food-card,.mv-slide');
  const panel=card.querySelector('.guide-panel');
  const open=panel.classList.toggle('open');
  btn.classList.toggle('active',open);btn.textContent=open?'✕':'📋';
}
function toggleTodo(item,preventToggle=false){
  if(!preventToggle)item.classList.toggle('done');
  const sec=item.closest('.todo-section');
  const all=sec.querySelectorAll('.todo-item').length;
  const done=sec.querySelectorAll('.todo-item.done').length;
  sec.querySelector('.todo-progress-fill').style.width=(all>0?done/all*100:0)+'%';
  sec.querySelector('.todo-progress-text').textContent=done+' / '+all+' 完成';
}
function scrollFood(id,dir,navId){
  const el=document.getElementById(id);
  el.scrollBy({left:dir*(el.querySelector('.food-card').offsetWidth+12),behavior:'smooth'});
}
function syncFoodNav(el,navId){
  const nav=document.getElementById(navId);
  const cards=[...el.querySelectorAll('.food-card')];
  if(!cards.length)return;
  const idx=Math.round(el.scrollLeft/(cards[0].offsetWidth+12));
  nav.querySelectorAll('.food-nav-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
  nav.querySelectorAll('.food-nav-btn')[0].disabled=idx===0;
  nav.querySelectorAll('.food-nav-btn')[1].disabled=idx>=cards.length-1;
}
